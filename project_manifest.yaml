# Fill group_id and student_id before submission. Paths are relative to the ZIP root.
project:
  group_id: "G007"
  title: "Occuscope"
  problem_statement: >
    SIT students cannot tell whether campus spaces are quiet or crowded, whether
    discussion rooms on a floor are free, or what events are on, without walking
    the building. Occuscope is a hierarchical campus map (campus → building →
    floor → location) showing Quiet/Moderate/Crowded bands and today's events.
  cloud_provider: "AWS"
  repository_commit: ""

team:
  members:
    - name: "Zi Qian"
      student_id: "2501958"
      role: "Frontend / Map"
    - name: "Zul"
      student_id: "2500993"
      role: "Backend / Database"
    - name: "Lideon"
      student_id: "2501098"
      role: "Data / Machine Learning"
    - name: "Kristen"
      student_id: "2501481"
      role: "Cloud / Scalability"
    - name: "Ryan"
      student_id: "2501205"
      role: "Security / Monitoring / Testing"

architecture:
  diagram: "evidence/architecture.png"
  service_model: "Serverless FaaS/PaaS on AWS: API Gateway HTTP API + AWS Lambda (Python 3.11) + Amazon S3. AWS manages servers, OS, patching and scaling; the team owns code, configuration, data and IAM use. Groq LLM API is an external SaaS for the chatbot."
  deployment_model: "Public cloud, single region (us-east-1), AWS Academy Learner Lab account. No VMs, load balancer or managed database; see evidence/deploy-log.md for the alternatives considered."
  components:
    - "crowdmap-http (API Gateway HTTP API, HTTPS, throttling)"
    - "crowdmap-web (Lambda: serves src/frontend from the private web bucket)"
    - "crowdmap-api (Lambda reader: map, forecasts, events, chat)"
    - "crowdmap-bookings (Lambda single writer: login, bookings; reserved concurrency 1)"
    - "crowdmap-web-<group> (S3, private: frontend files)"
    - "crowdmap-lake-<group> (S3, private, versioned: db/occuscope.db SQLite)"
    - "occupancy-model (hour x room-type mean, precomputed into the database)"
    - "CloudWatch Logs, 7 alarms, dashboard crowdmap; SNS topic crowdmap-alerts"
    - "AWS Budgets crowdmap-monthly"
    - "Groq API (external SaaS, chatbot)"
  deploy_log: "evidence/deploy-log.md"
  deployment_check: "evidence/aws-deployment-check.txt"
  build_command: "bash src/infra/build_lambda_package.sh"
  verify_command: "bash src/infra/verify_deployment.sh <api-id>  # AWS CloudShell; output redacted"

evidence:
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"

data_ai:
  dataset: "data/README.md"
  method: "Hour×room-type mean on ROBOD (14-day date hold-out). SIT occupancy = (prediction/type p95)×capacity × AY2026/27 Tri 1 calendar, MOM 2026 holidays, E=IT IWSP mix, W3/W5=other courses, W1 library shared, mixed event turnout. OIP disabled."
  evaluation: "Held-out NUS dates MAE/RMSE/R² (mean MAE 1.74); MAE by type/hour; 7 vs 14-day window; persist vs v0 on 1–2h; NUS crowd-band shares at 08:00 vs 15:00. SIT values generated, not labelled"
  reproducible_command: "python analytics/02_clean_robod.py && python analytics/04_train.py && python analytics/06_holdout_diagnostics.py && python analytics/05_generate_sit.py && python src/db/init_app_db.py"

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: ".env locally; .env.example in repo; no secrets in git or screenshots"

run:
  prerequisites:
    - "Python 3.11+"
    - "data/processed/robod_clean.csv for 04_train / 06_holdout_diagnostics (in repo). data/raw/ ROBOD+xlsx only to rebuild clean file or C5 Wi-Fi ablation"
    - "Node.js 18+ for src/frontend (no npm install needed)"
  commands:
    - "python analytics/02_clean_robod.py"
    - "python analytics/04_train.py"
    - "python analytics/06_holdout_diagnostics.py"
    - "python analytics/05_generate_sit.py"
    - "python src/db/init_app_db.py"
    - "python tests/test_crowd_and_seed.py"
    - "python -m pip install -r src/backend/requirements.txt -r tests/requirements-test.txt"
    - "python -m uvicorn src.backend.api:app --port 8000"
    - "node src/frontend/server.mjs"
    - "python tests/test_api_security.py"
    - "python tests/test_no_secrets_in_tracked_files.py"
    - "python tests/test_submission_preflight.py"
    - "python tests/test_frontend_server_security.py"

declarations:
  ai_use: "AI_USE_DECLARATION.md"
  contributions: "TEAM_CONTRIBUTIONS.md"
